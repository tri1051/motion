<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071522">
<title>30초 눈 내림 카운트다운</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{color-scheme:dark;font-family:'Noto Sans KR',sans-serif;background:#071522;color:#f7fbff}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#071522}.stage{position:absolute;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 34%,#27455c 0,#122a3d 38%,#081724 76%,#050e18 100%)}.aurora{position:absolute;inset:-20%;background:radial-gradient(ellipse at 23% 38%,#5686a52a 0,transparent 38%),radial-gradient(ellipse at 78% 62%,#6da3bd20 0,transparent 35%);filter:blur(22px);animation:glow 18s ease-in-out infinite alternate}.haze{position:absolute;inset:0;background:linear-gradient(180deg,#08172422 0%,transparent 35%,#06111a38 100%)}.stars{position:absolute;inset:0;opacity:.38;background-image:radial-gradient(1px 1px at 14% 24%,#e9f6ff8a 99%,transparent),radial-gradient(1px 1px at 73% 18%,#e9f6ff6b 99%,transparent),radial-gradient(1px 1px at 86% 44%,#e9f6ff55 99%,transparent),radial-gradient(1px 1px at 31% 67%,#e9f6ff60 99%,transparent),radial-gradient(1px 1px at 60% 78%,#e9f6ff55 99%,transparent);background-size:337px 291px}.snow-layer{position:absolute;inset:-15% 0 0;pointer-events:none;overflow:hidden}.flake{position:absolute;top:-10%;left:var(--x);width:var(--size);height:var(--size);border-radius:50%;background:#eef8ff;opacity:var(--opacity);filter:blur(var(--blur));animation:fall var(--duration) linear var(--delay) infinite;will-change:transform}.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 20%,#030a1280 100%);pointer-events:none}.center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}.timer{font:400 clamp(120px,22vw,310px)/.9 'IBM Plex Mono',monospace;letter-spacing:-.09em;padding-right:.09em;font-variant-numeric:tabular-nums;color:#f4f9ff;text-shadow:0 0 24px #c6e7ff38,0 0 90px #7bb3d42a;transition:opacity .25s,transform .25s}.timer.tick{animation:tick .32s ease-out}.timer.done{font-size:clamp(32px,6vw,78px);letter-spacing:.04em;padding:0;text-shadow:0 0 35px #c6e7ff44}.label{position:absolute;top:calc(50% + clamp(80px,13vw,174px));left:0;right:0;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.38em;color:#d2e5f4a6;transition:opacity .5s}.label span{display:inline-block;margin:0 9px;color:#b9d9ee64}.controls{position:absolute;z-index:5;inset:0;display:grid;place-items:center;background:#030a18a1;backdrop-filter:blur(5px);opacity:1;transition:opacity .35s,visibility .35s}.controls.hidden{opacity:0;visibility:hidden;pointer-events:none}.panel{text-align:center}.play{display:inline-flex;align-items:center;gap:12px;padding:15px 25px;border:1px solid #dceeff75;border-radius:999px;background:#eaf5ff;color:#132c40;font:500 15px 'Noto Sans KR',sans-serif;cursor:pointer;box-shadow:0 8px 40px #bddfff25;transition:transform .2s,box-shadow .2s}.play:hover{transform:translateY(-2px);box-shadow:0 12px 46px #bddfff40}.play:focus-visible{outline:3px solid #88c7ee;outline-offset:4px}.play svg{width:14px;height:14px}.hint{margin-top:16px;color:#d0e1ee9a;font-size:12px;letter-spacing:.08em}.replay{position:absolute;z-index:4;right:3.2%;bottom:5%;padding:9px 14px;border:1px solid #e4f3ff31;border-radius:999px;background:#07152279;color:#eaf4faad;font:12px 'Noto Sans KR',sans-serif;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s}.replay.show{opacity:1;pointer-events:auto}.replay:hover{background:#e6f4ff20;color:#fff}.progress{position:absolute;z-index:3;bottom:0;left:0;width:100%;height:2px;background:#d4eaff12}.progress i{display:block;height:100%;width:0;background:#d7efff9a;box-shadow:0 0 10px #b9e3ff;transform-origin:left}.running .progress i{animation:progress 30s linear forwards}.signature{position:absolute;left:3.4%;bottom:5.2%;font:10px 'IBM Plex Mono',monospace;letter-spacing:.2em;color:#d9eafa51}.grain{position:absolute;inset:-50%;opacity:.08;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");animation:grain .3s steps(2) infinite}@keyframes fall{0%{transform:translate3d(0,-12vh,0)}25%{transform:translate3d(calc(var(--drift)*.25),24vh,0)}50%{transform:translate3d(calc(var(--drift)*.55),54vh,0)}75%{transform:translate3d(calc(var(--drift)*.78),84vh,0)}100%{transform:translate3d(var(--drift),120vh,0)}}@keyframes tick{0%{transform:scale(1.07);opacity:.55}100%{transform:scale(1);opacity:1}}@keyframes progress{to{width:100%}}@keyframes glow{to{transform:translate3%, -2%;opacity:.65}}@keyframes grain{0%{transform:translate(0,0)}50%{transform:translate(1%,-1%)}100%{transform:translate(-1%,1%)}}@media(prefers-reduced-motion:reduce){.aurora,.flake,.grain{animation-duration:60s}.running .progress i{animation-duration:30s}} 
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="눈 내리는 30초 카운트다운">
  <div class="aurora"></div><div class="stars"></div>
  <div class="snow-layer" id="snowBack" aria-hidden="true"></div>
  <div class="snow-layer" id="snowFront" aria-hidden="true"></div>
  <div class="haze"></div><div class="vignette"></div>
  <div class="center" aria-live="polite" aria-atomic="true">
    <div><div class="timer" id="timer">30</div><div class="label" id="label">SLOW SNOWFALL <span>·</span> COUNTDOWN</div></div>
  </div>
  <div class="signature">30 SECONDS <span>·</span> WINTER NIGHT</div>
  <div class="progress"><i id="progress"></i></div>
  <button class="replay" id="replay" type="button">↻ 처음부터</button>
  <div class="controls" id="cover"><div class="panel"><button class="play" id="play" type="button"><svg viewBox="0 0 12 14" aria-hidden="true"><path d="M1 1.2a.8.8 0 0 1 1.2-.7l8.5 4.9a1.8 1.8 0 0 1 0 3.2l-8.5 4.9A.8.8 0 0 1 1 12.8z" fill="currentColor"/></svg>재생하기</button><div class="hint">30초 · 눈 내림 카운트다운</div></div></div>
  <div class="grain"></div>
</main>
<script>
(()=>{
 const stage=document.querySelector('#stage'),timer=document.querySelector('#timer'),label=document.querySelector('#label'),cover=document.querySelector('#cover'),replay=document.querySelector('#replay');
 let interval, timeout, endAt;
 let seed=30125;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
 function makeSnow(id,count,front){const layer=document.getElementById(id);for(let i=0;i<count;i++){const f=document.createElement('i');f.className='flake';const size=front?1.5+rand()*3.5:.8+rand()*2;f.style.setProperty('--x',(rand()*100)+'%');f.style.setProperty('--size',size+'px');f.style.setProperty('--opacity',(front?.25+rand()*.45:.12+rand()*.36).toFixed(2));f.style.setProperty('--blur',(front?rand()*.65:rand()*1.1)+'px');f.style.setProperty('--duration',(front?12+rand()*12:19+rand()*21)+'s');f.style.setProperty('--delay',(-rand()*38)+'s');f.style.setProperty('--drift',((rand()-.5)*(front?100:65))+'px');layer.appendChild(f)}}
 makeSnow('snowBack',88,false);makeSnow('snowFront',38,true);
 function finish(){clearInterval(interval);clearTimeout(timeout);interval=null;stage.classList.remove('running');timer.textContent='끝';timer.classList.add('done');label.style.opacity='0';replay.classList.add('show');}
 function play(){clearInterval(interval);clearTimeout(timeout);timer.classList.remove('done');timer.textContent='30';label.style.opacity='1';replay.classList.remove('show');cover.classList.add('hidden');stage.classList.remove('running');void stage.offsetWidth;stage.classList.add('running');endAt=Date.now()+30000;interval=setInterval(()=>{const remain=Math.max(0,endAt-Date.now());const n=Math.ceil(remain/1000);if(n<=0){timer.textContent='0';finish();return}if(timer.textContent!==String(n)){timer.textContent=String(n);timer.classList.remove('tick');void timer.offsetWidth;timer.classList.add('tick')}},50);timeout=setTimeout(finish,30000)}
 document.querySelector('#play').addEventListener('click',play);replay.addEventListener('click',play);
})();
</script>
</body>
</html>
