orm:scale(1.12);filter:blur(6px)}50%,64%{opacity:1;transform:scale(1);filter:blur(0)}72%,100%{opacity:0;transform:scale(.94)}}@keyframes four{0%,59%{opacity:0;transform:translateY(24px) scale(.88);letter-spacing:.3em}68%,80%{opacity:1;transform:translateY(0) scale(1);letter-spacing:.04em}88%,100%{opacity:0;transform:translateY(-12px)}}@keyframes five{0%,76%{opacity:0;transform:translateY(25px);filter:blur(8px)}84%,97%{opacity:1;transform:translateY(0);filter:blur(0)}100%{opacity:0;transform:translateY(-18px)}}@keyframes six{0%,79%{opacity:0;transform:translateY(10px)}86%,97%{opacity:.9;transform:translateY(0)}100%{opacity:0}}@keyframes stamp{0%,8%{opacity:0}16%,28%{opacity:.75}34%,100%{opacity:0}}@keyframes spark1{0%,15%{opacity:0;transform:translate(0,0)}25%{opacity:1}60%{opacity:.5;transform:translate(230px,-30px)}100%{opacity:0;transform:translate(410px,130px)}}@keyframes spark2{0%,43%{opacity:0;transform:translate(0,0)}56%{opacity:1}88%{opacity:.4;transform:translate(-160px,-100px)}100%{opacity:0;transform:translate(-260px,-120px)}}@keyframes spark3{0%,58%{opacity:0;transform:translate(0,0)}70%{opacity:1}94%{opacity:.4;transform:translate(-200px,210px)}100%{opacity:0;transform:translate(-250px,260px)}}.start{position:absolute;inset:0;display:grid;place-items:center;z-index:10;background:#06101de8;transition:opacity .7s ease;cursor:pointer}.start.hidden{opacity:0;pointer-events:none}.start button{font:600 inherit;color:#e9f7ff;background:#0e2840;border:1px solid #68bde877;border-radius:99px;padding:16px 34px;letter-spacing:.18em;font-size:clamp(12px,1.3vw,18px);cursor:pointer;transition:.3s}.start button:hover{background:#123b5d;border-color:#8cddff}.hint{position:absolute;top:calc(50% + 42px);width:100%;text-align:center;color:#8da9bd;font-size:12px;letter-spacing:.1em}.controls{position:absolute;bottom:4%;right:4%;z-index:8;color:#92b5ce;font-size:11px;letter-spacing:.1em;opacity:.7}.controls button{color:inherit;border:0;background:none;font:inherit;cursor:poi
